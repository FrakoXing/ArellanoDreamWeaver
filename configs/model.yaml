# ArellanoDreamWeaver - 模型架构详细配置

architecture:
  # === 输入编码器 ===
  encoders:
    music_feature_encoder:
      type: "CNN1D"
      layers:
        - in_channels: 128  # mel spectrogram bands
          out_channels: 256
          kernel_size: 3
          stride: 2
          padding: 1
        - in_channels: 256
          out_channels: 512
          kernel_size: 3
          stride: 2
          padding: 1
      output_dim: 512
    
    text_encoder:
      type: "Transformer"
      vocab_size: 50257    # GPT-2 token vocab
      d_model: 512
      n_heads: 8
      n_layers: 4
      max_length: 256
    
    bpm_encoder:
      type: "MLP"
      input_dim: 4         # [bpm_value, beat_position, time_signature, confidence]
      hidden_dims: [128, 256, 512]
      output_dim: 512
    
    positional_encoder:
      type: "Learned"
      max_len: 4096
      d_model: 512

  # === Transformer 主干 ===
  backbone:
    type: "MultiTaskTransformer"
    d_model: 512
    n_heads: 8
    n_encoder_layers: 6
    n_decoder_layers: 6
    d_ff: 2048
    dropout: 0.1
    activation: "gelu"
    
    # 交叉注意力 (融合不同模态)
    cross_attention:
      enabled: true
      n_heads: 8
      
    # 自适应层归一化 (用于条件注入)
    ada_ln:
      enabled: true
      conditioning_dim: 512

  # === Diffusion U-Net ===
  unet:
    type: "ConditionalUNet"
    in_channels: 64       # 谱面特征维度
    out_channels: 64
    channel_mults: [1, 2, 4, 8]
    n_res_blocks: 2
    attention_resolutions: [16, 8]
    
    # 时间步嵌入
    time_embed_dim: 256
    
    # 条件嵌入 (来自 Transformer)
    condition_embed_dim: 512
    
    # 条件注入方式: crossattn, adagn, fiLM
    condition_type: "crossattn"

  # === 输出头 ===
  output_heads:
    note_head:
      type: "ClassificationHead"
      in_features: 512
      hidden_features: 256
      n_classes: 4
      dropout: 0.2
      
    position_head:
      type: "RegressionHead"
      in_features: 512
      hidden_features: 256
      output_dim: 2       # [x_position, y_position]
      
    timing_head:
      type: "RegressionHead"
      in_features: 512
      hidden_features: 256
      output_dim: 2       # [time, hold_time]

# === 总参数量估算 ===
estimated_parameters: ~85M